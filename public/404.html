<style>

    background-clip: text;
    filter: drop-shadow(0 0 40px rgba(70, 230, 255, .4));

  .nf-code {
    margin-top: 18px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .3em;
    color: var(--cyan);
  }

    margin-top: 14px;
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    font-weight: 600;
    letter-spacing: -.03em;
  }
  .nf p {
    margin: 14px auto 0;
    max-width: 46ch;
    color: var(--muted);
    font-size: 14.5px;
