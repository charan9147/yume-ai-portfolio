name: Weekly maintenance

# Opens a Monday-morning checklist issue so the site gets looked after on a
# schedule instead of only when something breaks.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: Open weekly checklist
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://yume-ai.pages.dev' }}
    steps:
      - name: Create this week's maintenance issue
        uses: actions/github-script@v7
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://yume-ai.pages.dev' }}
        with:
          script: |
            const url = process.env.SITE_URL;
            const today = new Date().toISOString().slice(0, 10);

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'maintenance',
              per_page: 10,
            });

            if (open.data.length) {
              core.info(`A maintenance issue is already open (#${open.data[0].number}); skipping.`);
              return;
            }

            const body = [
              `Week of **${today}** · ${url}`,
              '',
              '### Weekly checks',
              '- [ ] Site loads on desktop and mobile (open the real URL, not localhost)',
              '- [ ] Analytics dashboard still unlocks and counts are moving',
              '- [ ] Contact links work: Gmail, WhatsApp, phone',
              '- [ ] No broken images (open DevTools → Network, filter "Img")',
              '- [ ] Cloudflare → Deployments: last build is green',
              '',
              '### Worth doing this month',
              '- [ ] Log in to Cloudflare once and skim Web Analytics (Core Web Vitals)',
              '- [ ] Refresh any content that has changed (courses, goals, timeline)',
              '- [ ] Read the site out loud — does every claim still feel honest?',
              '',
              '### Update the site',
              '```bash',
              'git pull',
              '# edit index.html / styles.css / assets',
              'git add -A',
              'git commit -m "content: describe the change"',
              'git push        # Cloudflare Pages rebuilds automatically',
              '```',
              '',
              '_Opened automatically by `.github/workflows/weekly-maintenance.yml`. Close it when done — the next issue is created only when this one is closed._',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly maintenance — ${today}`,
              labels: ['maintenance'],
              body,
            });
